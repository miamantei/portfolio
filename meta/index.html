<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta</title>
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../global.js"></script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <h1>Meta</h1>
  <p>This page shows stats about the code of this website.</p>

  <div id="time-filter">
    <label>
      Show commits until:
      <input type="range" id="commit-progress" min="0" max="100" value="100" />
      <time id="commit-time"></time>
    </label>
  </div>

  <div id="stats"></div>

  <h2>Commits by time of day</h2>

  <!-- NEW: the scrollytelling section -->
  <div id="scrolly-1">
    <!-- Left: the story (filled in by JavaScript in Step 3.2) -->
    <div id="scatter-story"></div>

    <!-- Right: the chart, plus the info that updates when you brush -->
    <div id="scatter-plot">
      <div id="chart"></div>
      <p id="selection-count">No commits selected</p>
      <dl id="language-breakdown" class="stats"></dl>
    </div>
  </div>

  <!-- MOVED: the file "race" now lives at the bottom -->
  <dl id="files"></dl>

  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd><a href="" id="commit-link" target="_blank"></a></dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <dt>Time</dt>
    <dd id="commit-tooltip-time"></dd>

    <dt>Author</dt>
    <dd id="commit-author"></dd>

    <dt>Lines edited</dt>
    <dd id="commit-lines"></dd>
  </dl>
</body>
</html>
